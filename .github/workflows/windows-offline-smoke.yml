name: Windows offline smoke

on:
  push:
    branches:
      - codex/windows-offline-smoke

jobs:
  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test offline runner
        run: pnpm test:scripts

      - name: Offline test
        run: pnpm test:offline
